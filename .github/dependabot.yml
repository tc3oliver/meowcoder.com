version: 2

updates:
  # npm dependencies. Patch/minor devDependency bumps are grouped into a single
  # PR so routine toolchain updates stay one review instead of a dozen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions are pinned to commit SHAs in .github/workflows/**; Dependabot
  # updates the SHA and the version comment together, which is what keeps SHA
  # pinning maintainable rather than permanently stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
