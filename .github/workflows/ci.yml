name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are safe to cancel. Cancelling on main would leave the
  # superseded commit without a green status, which MCD-13 gates on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by version + SHA256 so the scanner cannot change under the repository.
  # Bump both together from https://github.com/gitleaks/gitleaks/releases.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Runs after Build because it walks the generated site in dist/ as well as
      # the repository Markdown.
      - name: Link check
        run: npm run linkcheck

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false

      # The upstream gitleaks Action is distributed under a commercial EULA; the
      # scanner itself is MIT. Installing the release binary keeps this step free
      # of any external account or licence key, and makes it reproducible locally
      # with the exact same commands.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner

      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
