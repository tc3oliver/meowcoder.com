name: Publish site

# Publish only a tested main-branch commit. Pull-request CI runs cannot deploy:
# workflow_run is restricted to main and the job additionally checks the
# triggering event, branch and successful conclusion before using secrets.
#
# The Study feed is read at build time (PRD §28), so daily rebuilding still
# refreshes the homepage's latest-post pointer between source changes.
#
# GitHub cron is UTC. 21:00 UTC is 05:00 the next day in Taipei (UTC+8), so a
# piece published during the day is live by the following morning.
#
# Note: GitHub disables scheduled workflows in repositories with no activity for
# 60 days. If the feed ever stops updating, check that first.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 21 * * *'
  # A manual publish remains available from Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On CI completion, deploy that exact validated source revision.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The same command CI and Cloudflare use. A second build path would be a
      # second thing to keep correct.
      - name: Build
        run: npm run build

      # Deploys the built output through the existing wrangler.jsonc, which
      # declares assets only and no `main` — see decision-4.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
